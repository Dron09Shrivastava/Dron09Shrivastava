<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Dron Shrivastava - Full-Stack Developer">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="1010" cy="95" r="72"/>
    </clipPath>
    <filter id="avatarGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#764ba2" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="1200" height="210" fill="url(#bannerGrad)"/>

  <path d="M0,185 C120,215 240,165 360,190 C480,215 600,170 720,195 C840,220 960,175 1080,200 C1140,210 1170,205 1200,195 L1200,250 L0,250 Z" fill="#764ba2" opacity="0.55"/>
  <path d="M0,200 C150,230 300,180 450,205 C600,230 750,185 900,210 C1050,235 1150,195 1200,205 L1200,250 L0,250 Z" fill="#667eea" opacity="0.35"/>

  <text x="70" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Dron Shrivastava</text>
  <text x="72" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#ffffff" opacity="0.92">Full-Stack Developer</text>

  <g filter="url(#avatarGlow)">
    <circle cx="1010" cy="95" r="78" fill="none" stroke="url(#ringGrad)" stroke-width="5"/>
  </g>
  <circle cx="1010" cy="95" r="72" fill="#1a1033"/>
  <image href="https://raw.githubusercontent.com/Dron09Shrivastava/Dron09Shrivastava/main/assets/ai-avatar.png" x="938" y="23" width="144" height="144" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <rect x="952" y="168" width="116" height="28" rx="14" fill="#ffffff" opacity="0.95"/>
  <text x="1010" y="187" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#764ba2" text-anchor="middle">AI Avatar</text>
</svg>
